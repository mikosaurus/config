# hyprlock config, see https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

# Catppuccin Macchiato, same flavor as tmux, waybar and rofi
$font = monospace
$base = rgb(24273a)
$surface = rgba(36, 39, 58, 0.6)
$text = rgb(cad3f5)
$subtext = rgb(a5adcb)
$blue = rgb(8aadf4)
$green = rgb(a6da95)
$red = rgb(ed8796)

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# blurred screenshot of the desktop, $base is the fallback if the screenshot fails
background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 3
    brightness = 0.6
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/#variable-substitution
    color = $text
    font_size = 96
    font_family = $font

    position = 0, 180
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    color = $subtext
    font_size = 20
    font_family = $font

    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    inner_color = $surface

    outer_color = $blue
    check_color = $green
    fail_color = $red

    font_color = $text
    fade_on_empty = false
    rounding = 12

    font_family = $font
    placeholder_text = $USER
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}
